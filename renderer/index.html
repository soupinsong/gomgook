<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>딸깍 사전</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 상단 바 (드래그로 이동) -->
    <header class="titlebar">
      <div class="title"><span class="dot">🌿</span> 논문을 거꾸로 하면 곰국</div>
      <div class="titlebar-buttons">
        <button id="btn-trigger" class="tb-btn" title="감지 방식">⌨</button>
        <button id="btn-pin" class="tb-btn" title="항상 위 고정 켜기/끄기">📌</button>
        <button id="btn-settings" class="tb-btn" title="설정">⚙</button>
        <button id="btn-min" class="tb-btn" title="최소화">—</button>
        <button id="btn-close" class="tb-btn tb-close" title="닫기">✕</button>
      </div>
    </header>

    <!-- 현재 논문 표시줄 -->
    <button id="paperbar" class="paperbar" title="논문 노트 열기">
      <span class="pb-icon">📁</span>
      <span id="paper-name" class="pb-name">기본 노트</span>
      <span id="paper-count" class="pb-count"></span>
      <span class="pb-caret">▾</span>
    </button>

    <!-- 본문 -->
    <main class="content">
      <!-- 선택된 원문 -->
      <section id="source-box" class="source-box hidden">
        <div class="source-label">선택한 원문</div>
        <div id="source-text" class="source-text"></div>
        <button id="btn-lookup" class="lookup-btn">🔍 다시 풀이</button>
      </section>

      <!-- 예시 이미지 -->
      <section id="image-box" class="image-box hidden">
        <img id="image-img" alt="예시 이미지" />
        <div id="image-cap" class="image-cap"></div>
      </section>

      <!-- 결과 -->
      <section id="result" class="result">
        <div class="empty-state" id="empty-state">
          <p>논문에서 단어·문장을 <b>드래그해서 복사(Ctrl+C)</b>하면</p>
          <p>여기에 번역과 쉬운 풀이가 나타나요.</p>
        </div>
      </section>
    </main>

    <!-- 추가 질문 입력 -->
    <div id="followup" class="followup hidden">
      <input
        id="followup-input"
        type="text"
        placeholder="궁금한 걸 이어서 물어보세요…"
        autocomplete="off"
      />
      <button id="followup-send" class="followup-send" title="보내기">➤</button>
    </div>

    <!-- 상태 표시줄 -->
    <footer class="statusbar">
      <span id="status">준비됐어요 🌿</span>
      <span id="model-badge" class="model-badge"></span>
    </footer>

    <!-- 설정 패널 -->
    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-header">
        <h2>설정</h2>
        <button id="btn-settings-close" class="tb-btn">✕</button>
      </div>

      <label class="field">
        <span>엔진</span>
        <select id="in-provider">
          <option value="gemini">🆓 Gemini (무료 · 기본)</option>
          <option value="claude">💳 Claude (유료 · 더 안정적)</option>
        </select>
      </label>

      <!-- Gemini(무료) 설정 -->
      <div id="block-gemini" class="provider-block">
        <label class="field">
          <span>Gemini API 키</span>
          <input id="in-gemini-key" type="password" placeholder="AIza..." />
          <small id="env-hint-gemini" class="hint"></small>
          <small class="hint">
            발급: aistudio.google.com/apikey (구글 로그인 → Create API key, 카드 불필요)
          </small>
        </label>
        <label class="field">
          <span>모델</span>
          <select id="in-gemini-model">
            <option value="gemini-flash-latest">최신 Flash (자동)</option>
          </select>
          <button type="button" id="btn-refresh-models" class="lookup-btn">
            🔄 내 키로 쓸 수 있는 모델 불러오기
          </button>
          <small id="models-hint" class="hint"></small>
        </label>
      </div>

      <!-- Claude(유료) 설정 -->
      <div id="block-claude" class="provider-block hidden">
        <label class="field">
          <span>Anthropic API 키</span>
          <input id="in-claude-key" type="password" placeholder="sk-ant-..." />
          <small id="env-hint-claude" class="hint"></small>
        </label>
        <label class="field">
          <span>모델</span>
          <select id="in-claude-model">
            <option value="claude-sonnet-4-6">Sonnet 4.6 (빠름)</option>
            <option value="claude-opus-4-8">Opus 4.8 (더 깊은 설명)</option>
            <option value="claude-haiku-4-5">Haiku 4.5 (가장 저렴)</option>
          </select>
        </label>
      </div>

      <label class="field">
        <span>감지 방식</span>
        <select id="in-trigger">
          <option value="apps">특정 앱에서 복사 시 (삼성노트·PDF 등 · 권장)</option>
          <option value="auto">아무 앱에서나 복사하면</option>
          <option value="hotkey">단축키를 눌렀을 때만</option>
        </select>
      </label>
      <label class="field" id="field-apps">
        <span>감지할 프로그램</span>
        <input id="in-apps" type="text" placeholder="samsungnotes, acrobat, foxit …" />
        <small class="hint">프로그램 이름 일부를 쉼표로 구분 (대소문자 무관).</small>
        <small id="apps-skipped" class="hint"></small>
      </label>
      <label class="field" id="field-hotkey">
        <span>단축키</span>
        <input id="in-hotkey" type="text" placeholder="예: Ctrl+Shift+Space" />
        <small class="hint">
          텍스트를 복사한 뒤 이 조합을 누르면 풀이해요. (Ctrl / Alt / Shift + 키)
        </small>
      </label>
      <label class="field">
        <span>설명 눈높이</span>
        <input id="in-level" type="text" placeholder="예: 고등학교 1학년" />
      </label>
      <button id="btn-save" class="save-btn">저장</button>
      <p class="settings-note">
        키는 이 PC에만 저장됩니다. 언제든 엔진을 무료↔유료로 바꿀 수 있어요.
      </p>
    </div>

    <!-- 논문 라이브러리 패널 -->
    <div id="library-panel" class="settings-panel hidden">
      <div class="settings-header">
        <h2>📁 논문 노트</h2>
        <button id="btn-library-close" class="tb-btn">✕</button>
      </div>
      <div class="lib-new">
        <input
          id="lib-new-title"
          type="text"
          placeholder="새 논문 이름 (예: Vitessce 논문)"
          autocomplete="off"
        />
        <button id="lib-new-btn" class="lib-new-btn">＋ 만들기</button>
      </div>
      <p class="lib-hint">
        논문을 고르면, 이후 풀이가 그 논문에 쌓이고 용어도 이어서 기억해요.
      </p>
      <div id="lib-list" class="lib-list"></div>
    </div>

    <!-- 노트 보기 패널 -->
    <div id="notebook-panel" class="settings-panel hidden">
      <div class="settings-header">
        <button id="btn-notebook-back" class="tb-btn">←</button>
        <h2 id="notebook-title">노트</h2>
        <span style="width: 27px"></span>
      </div>
      <div id="notebook-body" class="notebook-body"></div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
